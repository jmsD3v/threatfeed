[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatfeed"
version = "0.1.0"
description = "D-02 — CTI Aggregator: multi-source threat intelligence with AI enrichment"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "aiohttp>=3.9",
    "aiofiles>=23.2",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "google-generativeai>=0.7",
    "anthropic>=0.34",
    "openai>=1.40",
    "pydantic>=2.0",
    "tqdm>=4.66",
    "ipaddress",
]

[project.scripts]
threatfeed = "threatfeed.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["threatfeed*"]
